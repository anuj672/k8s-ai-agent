apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: demo
  labels:
    app: catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-svc
  namespace: demo
spec:
  selector:
    app: catalog-api
  ports:
    - port: 80
      targetPort: 80