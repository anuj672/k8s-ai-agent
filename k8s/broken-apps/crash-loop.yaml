apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: demo
  labels:
    app: payments-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "Starting payments-api v2.3.1..."
              echo "Loading configuration..."
              echo "FATAL: DATABASE_URL environment variable not set"
              exit 1